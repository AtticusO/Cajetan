[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cajetan"
version = "0.1.0"
description = "Statistical confidence ratings for NFL parlays"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.5",
    "duckdb>=1.1",
    "polars>=1.0",
    "pyarrow>=15",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.12",
    "scikit-learn>=1.5",
    "joblib>=1.3",
    "typer>=0.12",
    "rich>=13",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cajetan = "cajetan.cli:app"

[tool.setuptools.packages.find]
include = ["cajetan*"]

[tool.setuptools.package-data]
cajetan = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
